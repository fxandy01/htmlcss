<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Web Saya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Halaman Web Saya</h1>
    <nav>
      <a href="#beranda">Beranda</a>
      <a href="#tentang">Tentang</a>
      <a href="#kontak">Kontak</a>
    </nav>
  </header>

  <main>
    <section id="beranda">
      <h2>Selamat Datang</h2>
      <p>Ini adalah halaman utama website sederhana yang dibuat dengan HTML dan CSS.</p>
    </section>

    <section id="tentang">
      <h2>Tentang</h2>
      <p>Tulis deskripsi singkat tentang diri Anda atau proyek Anda di sini.</p>
    </section>

    <section id="kontak">
      <h2>Kontak</h2>
      <form>
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="4"></textarea>

        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Halaman Web Saya</p>
  </footer>
</body>
</html>
